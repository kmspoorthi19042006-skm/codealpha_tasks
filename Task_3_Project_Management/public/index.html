<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FlowPilot</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f7f5;
            color: #111;
            font-family: Arial, sans-serif;
        }

        .loader {
            text-align: center;
        }

        .loader-mark {
            width: 46px;
            height: 46px;
            margin: 0 auto 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #111;
            color: white;
            border-radius: 13px;

            font-size: 18px;
            font-weight: 800;
        }

        p {
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="loader">
    <div class="loader-mark">F</div>
    <strong>FlowPilot</strong>
    <p>Loading workspace...</p>
</div>

<script>
    const token = localStorage.getItem("flowpilot_token");

    if (token) {
        window.location.replace("/dashboard.html");
    } else {
        window.location.replace("/login.html");
    }
</script>

</body>
</html>
