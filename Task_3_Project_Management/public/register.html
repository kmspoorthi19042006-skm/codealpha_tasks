<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account — FlowPilot</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body>

<div class="auth-page">

    <!-- LEFT BRAND PANEL -->
    <section class="auth-brand-panel">
        <div class="brand-content">

            <a href="/" class="brand-logo">
                <span class="brand-mark">F</span>
                <span>FlowPilot</span>
            </a>

            <div class="brand-copy">
                <p class="eyebrow">SMART PROJECT MANAGEMENT</p>

                <h1>
                    Turn ideas into
                    <span>progress.</span>
                </h1>

                <p>
                    Organize projects, coordinate teams,
                    and keep every task moving forward.
                </p>
            </div>

            <div class="brand-footer">
                <span>Built for focused teams.</span>
                <span>2026</span>
            </div>

        </div>

        <div class="brand-circle circle-one"></div>
        <div class="brand-circle circle-two"></div>
        <div class="brand-circle circle-three"></div>
    </section>


    <!-- REGISTER PANEL -->
    <section class="auth-form-panel">

        <div class="auth-card">

            <div class="mobile-brand">
                <span class="brand-mark">F</span>
                <strong>FlowPilot</strong>
            </div>

            <div class="auth-heading">

                <p class="eyebrow">GET STARTED</p>

                <h2>Create your account</h2>

                <p>
                    Start managing your projects with FlowPilot.
                </p>

            </div>


            <!-- ERROR / SUCCESS MESSAGE -->
            <div
                id="authError"
                class="auth-message"
                style="display:none;"
            ></div>


            <!-- REGISTER FORM -->
            <form id="registerForm" class="auth-form">

                <!-- FULL NAME -->
                <div class="form-group">

                    <label for="fullName">
                        Full name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- USERNAME -->
                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- EMAIL -->
                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Minimum 6 characters"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            id="passwordToggle"
                            class="password-toggle"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- SUBMIT -->
                <button
                    type="submit"
                    id="registerButton"
                    class="btn btn-primary btn-block"
                >
                    Create account
                </button>

            </form>


            <div class="auth-divider">
                <span>Already have an account?</span>
            </div>


            <a
                href="/login.html"
                class="btn btn-secondary btn-block"
            >
                Sign in
            </a>

        </div>

    </section>

</div>


<!-- IMPORTANT: API FIRST, AUTH SECOND -->
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>

</body>
</html>
