<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account • Vibe</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/auth.css"
    >

</head>


<body>

    <main class="auth-page">

        <div class="auth-orb auth-orb-one"></div>
        <div class="auth-orb auth-orb-two"></div>


        <section class="auth-layout">

            <!-- Brand -->
            <div class="auth-brand">

                <a
                    href="index.html"
                    class="brand-logo"
                >

                    <span class="brand-mark">
                        V
                    </span>

                    <span>
                        Vibe
                    </span>

                </a>


                <div class="brand-content">

                    <span class="eyebrow">
                        JOIN THE CONVERSATION
                    </span>

                    <h1>
                        Your voice
                        <span>belongs here.</span>
                    </h1>

                    <p>
                        Create your space, share what
                        inspires you, and connect with
                        people who get it.
                    </p>

                </div>


                <div class="brand-note">

                    <span class="brand-note-dot"></span>

                    Create. Connect. Share.

                </div>

            </div>


            <!-- Registration card -->
            <div class="auth-card register-card">

                <div class="auth-card-header">

                    <span class="mobile-brand">
                        V
                    </span>

                    <h2>
                        Create your account
                    </h2>

                    <p>
                        It only takes a minute to get started.
                    </p>

                </div>


                <form
                    id="registerForm"
                    class="auth-form"
                >

                    <div class="form-row">

                        <div class="form-group">

                            <label
                                class="form-label"
                                for="name"
                            >
                                Full name
                            </label>

                            <input
                                class="form-input"
                                type="text"
                                id="name"
                                name="name"
                                placeholder="Your name"
                                autocomplete="name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label
                                class="form-label"
                                for="username"
                            >
                                Username
                            </label>

                            <input
                                class="form-input"
                                type="text"
                                id="username"
                                name="username"
                                placeholder="@username"
                                autocomplete="username"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label
                            class="form-label"
                            for="registerEmail"
                        >
                            Email address
                        </label>

                        <input
                            class="form-input"
                            type="email"
                            id="registerEmail"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label
                            class="form-label"
                            for="registerPassword"
                        >
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                class="form-input"
                                type="password"
                                id="registerPassword"
                                name="password"
                                placeholder="At least 6 characters"
                                autocomplete="new-password"
                                minlength="6"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="registerPasswordToggle"
                                aria-label="Show password"
                            >
                                Show
                            </button>

                        </div>

                        <div
                            class="password-strength"
                            id="passwordStrength"
                        >
                            <span></span>
                            <span></span>
                            <span></span>
                            <small>
                                Use 6+ characters
                            </small>
                        </div>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary auth-submit"
                        id="registerButton"
                    >
                        Create account
                    </button>

                </form>


                <div class="auth-divider">
                    <span>or</span>
                </div>


                <p class="auth-switch">

                    Already have an account?

                    <a href="login.html">
                        Sign in
                    </a>

                </p>

            </div>

        </section>

    </main>


    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
