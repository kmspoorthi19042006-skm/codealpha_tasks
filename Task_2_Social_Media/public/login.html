<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign In • Vibe</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/auth.css"
    >
</head>

<body>

    <main class="auth-page">

        <!-- Decorative background -->
        <div class="auth-orb auth-orb-one"></div>
        <div class="auth-orb auth-orb-two"></div>

        <section class="auth-layout">

            <!-- Brand section -->
            <div class="auth-brand">

                <a
                    href="index.html"
                    class="brand-logo"
                >
                    <span class="brand-mark">V</span>
                    <span>Vibe</span>
                </a>

                <div class="brand-content">

                    <span class="eyebrow">
                        YOUR PEOPLE. YOUR SPACE.
                    </span>

                    <h1>
                        Stay connected to
                        <span>what matters.</span>
                    </h1>

                    <p>
                        Share ideas, discover people,
                        and build meaningful connections
                        in one beautiful space.
                    </p>

                </div>

                <div class="brand-note">
                    <span class="brand-note-dot"></span>
                    A space made for genuine connections.
                </div>

            </div>


            <!-- Login card -->
            <div class="auth-card">

                <div class="auth-card-header">

                    <span class="mobile-brand">
                        V
                    </span>

                    <h2>
                        Welcome back
                    </h2>

                    <p>
                        Sign in to continue to your world.
                    </p>

                </div>


                <form
                    id="loginForm"
                    class="auth-form"
                >

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="email"
                        >
                            Email address
                        </label>

                        <input
                            class="form-input"
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <div class="password-label-row">

                            <label
                                class="form-label"
                                for="password"
                            >
                                Password
                            </label>

                        </div>

                        <div class="password-wrapper">

                            <input
                                class="form-input"
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="passwordToggle"
                                aria-label="Show password"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary auth-submit"
                        id="loginButton"
                    >
                        Sign in
                    </button>

                </form>


                <div class="auth-divider">
                    <span>or</span>
                </div>


                <p class="auth-switch">

                    Don't have an account?

                    <a href="register.html">
                        Create one
                    </a>

                </p>

            </div>

        </section>

    </main>


    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
